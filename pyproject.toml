[project]
name = "cycrs-analysis"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["analysis/data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"analysis/notebooks/*.py" = ["E402", "B018", "E501"]
"analysis/notebooks/*.ipynb" = ["E402", "B018", "E501"]
"analysis/src/{audit,report_assets}.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
pythonpath = ["analysis"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
